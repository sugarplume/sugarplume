<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aiza Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background: linear-gradient(135deg,#ffe6f0,#e6f0ff,#e6fff5,#fff7e6);
color:#333;
overflow-x:hidden;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 20px;
background:rgba(255,255,255,0.5);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:10;
}

.logo{
font-family:'Playfair Display';
font-size:16px;
color:#444;
font-weight:600;
}

nav a{
margin:0 8px;
text-decoration:none;
font-size:12px;
color:#555;
}

/* HERO */
.hero{
text-align:center;
padding:40px 15px 20px;
}

.hero h1{
font-family:'Playfair Display';
font-size:28px;
margin-bottom:8px;
}

.hero p{
font-size:13px;
color:#666;
max-width:500px;
margin:auto;
}

/* BUTTON */
.btn{
margin-top:12px;
padding:10px 18px;
border:none;
border-radius:25px;
cursor:pointer;
font-size:13px;
color:white;
background:linear-gradient(90deg,#ffb6c1,#cdb4ff,#a0e7e5);
}

/* NOTION CONTAINER */
.planner{
width:92%;
max-width:1000px;
margin:30px auto;
background:rgba(255,255,255,0.6);
border-radius:18px;
padding:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.planner h2{
text-align:center;
font-family:'Playfair Display';
font-size:20px;
margin-bottom:10px;
}

/* IFRAME */
iframe{
width:100%;
height:600px;
border:none;
border-radius:12px;
}

/* FLOATING FLOWERS */
.floating{
position:absolute;
font-size:18px;
opacity:0.25;
animation: float 8s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-40px);}
100%{transform:translateY(0);}
}

/* MOBILE */
@media(max-width:600px){
.hero h1{font-size:22px;}
iframe{height:500px;}
}
</style>
</head>

<body>

<!-- floating aesthetic elements -->
<div class="floating" style="top:15%;left:5%;">🌸</div>
<div class="floating" style="top:25%;right:10%;">🌼</div>
<div class="floating" style="bottom:20%;left:10%;">🌷</div>
<div class="floating" style="bottom:30%;right:15%;">🌸</div>

<header>
<div class="logo">Aiza Planner</div>
<nav>
<a href="#">Home</a>
<a href="#">Planner</a>
<a href="#">Tasks</a>
</nav>
</header>

<section class="hero">
<h1>Your Aesthetic Notion Planner 🌷</h1>
<p>Organize your goals, tasks, and dreams in one soft, calming space designed for productivity & aesthetics.</p>
<button class="btn" onclick="document.getElementById('planner').scrollIntoView({behavior:'smooth'})">
Open Planner
</button>
</section>

<section class="planner" id="planner">
<h2>🌸 Notion Dashboard</h2>

<!-- 🔴 Replace this with your Notion link -->
<iframe src="YOUR_NOTION_LINK_HERE"></iframe>

</section>

</body>
</html>
